<title>QR-наклейки образцов</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
<style>
:root { --ink: #333; --muted: #7C7377; --line: #E7E7E7; --accent: #B95162; --bg: #F5F5F5 }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Montserrat, -apple-system, Arial, sans-serif }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px }
h1 { font-size: 22px; margin: 0 0 6px }
p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5 }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px }
.st { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; text-align: center; break-inside: avoid }
.st img { width: 100%; max-width: 230px; image-rendering: pixelated; display: block; margin: 0 auto }
.st figcaption { display: grid; gap: 2px; margin-top: 8px }
.st b { font-size: 16px }
.st span { font-size: 13px }
.st em { font-style: normal; font-size: 12px; color: var(--accent); font-weight: 600 }
@media print { body { background: #fff } p { display: none } .st { border-color: #ccc } }
</style></head><body><main>
