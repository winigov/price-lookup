<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#B95162">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>Цена в салоне</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout (variant C): price first in every row; fabric, category, search and a big round QR button live in one dock at the bottom, under the thumb */
:root {
  --bg: #F5F5F5; --surface: #FFFFFF; --ink: #333333; --muted: #6F6A6C; --line: #E7E7E7; --field: #F2EFF0;
  --accent: #B95162; --accent-ink: #FFFFFF; --accent-soft: #F7EAED;
  --ok: #2E7D4F; --ok-soft: #E5F2EA; --warn: #93641A; --warn-soft: #F8EEDC;
  --scheme: #FFFFFF; --shade: rgba(30, 20, 24, .48); --qr-glow: rgba(185, 81, 98, .35);
  --font: "Montserrat", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r: 6px; --dock-h: 150px; --kb: 0px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171416; --surface: #221E20; --ink: #EEE8EA; --muted: #ADA3A7; --line: #3A3336; --field: #2C2729;
  --accent: #C9606F; --accent-ink: #FFFFFF; --accent-soft: #3A2328;
  --ok: #74C995; --ok-soft: #1D3226; --warn: #E2B566; --warn-soft: #3A2F1B;
  --scheme: #F3EFF0; --shade: rgba(0, 0, 0, .62); --qr-glow: rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171416; --surface: #221E20; --ink: #EEE8EA; --muted: #ADA3A7; --line: #3A3336; --field: #2C2729;
  --accent: #C9606F; --accent-ink: #FFFFFF; --accent-soft: #3A2328;
  --ok: #74C995; --ok-soft: #1D3226; --warn: #E2B566; --warn-soft: #3A2F1B;
  --scheme: #F3EFF0; --shade: rgba(0, 0, 0, .62); --qr-glow: rgba(0, 0, 0, .45); color-scheme: dark }

* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }
h1, h2, h3 { text-wrap: balance }

#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: calc(var(--dock-h) + 16px) }
.wrap { padding-inline: 16px }
.stack { display: flex; flex-direction: column; gap: 10px }

/* header */
.head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 0 }
.head .logo { width: 44px; height: 44px; flex: none; display: block }
.head .ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.head .ttl b { font-size: 16px; line-height: 20px; font-weight: 700 }
.status { font-size: 12px; line-height: 16px; color: var(--ok) }
.sw { height: 44px; min-width: 44px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13px; flex: none; white-space: nowrap }
.sw.run { border-color: var(--accent); color: var(--accent); background: var(--accent-soft) }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line) }
.bar .title { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.back { border: 0; background: none; padding: 8px 8px 8px 0; display: inline-flex; align-items: center; gap: 2px; font-weight: 600; color: var(--accent); white-space: nowrap; font-size: 15px }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 2px; scrollbar-width: none }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; white-space: nowrap }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600 }

.sec { padding: 18px 16px 0 }
.cap { font-size: 12px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin: 0 0 10px }
.list { display: grid; gap: 10px }

/* price-first row */
.row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); text-align: left }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.row .p { font-size: 22px; line-height: 28px; font-weight: 700; white-space: nowrap }
.row .t { font-size: 14px; line-height: 18px; font-weight: 600 }
.row .s { font-size: 12px; line-height: 16px; color: var(--muted) }
.row .pic { width: 72px; height: 64px; flex: none; display: block; object-fit: contain; background: var(--scheme); border-radius: 4px }
.row .pic.photo { object-fit: cover }
.row.fabric .pic { width: 56px; height: 56px; object-fit: cover }

/* series row */
.srow { display: flex; gap: 12px; align-items: center; width: 100%; padding: 0; overflow: hidden; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); text-align: left }
.srow img { width: 104px; height: 84px; object-fit: cover; flex: none; display: block }
.srow .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 10px 12px 10px 0 }
.srow .t { font-size: 16px; line-height: 20px; font-weight: 700 }
.srow .s { font-size: 12px; line-height: 16px; color: var(--muted) }
.srow .p { font-size: 15px; line-height: 20px; font-weight: 600 }

.quick { display: flex; flex-wrap: wrap; gap: 8px }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 9px 12px; font-size: 13px; line-height: 18px }
.empty { text-align: center; padding: 24px 8px; color: var(--muted); font-size: 14px }
.empty b { color: var(--ink); display: block; margin-bottom: 6px }
.note { font-size: 12px; color: var(--muted); padding: 18px 16px 0; line-height: 1.5; margin: 0 }
.lnk { color: var(--accent); font-weight: 600; background: none; border: 0; padding: 0; font-size: 13px; text-decoration: none }
.ghost-btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); font-weight: 600; font-size: 14px; text-align: center; padding: 8px 12px }
.ghost-btn.accent { border: 1.5px dashed var(--accent); color: var(--accent); background: transparent }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }

/* detail */
.hero { background: var(--scheme); border-bottom: 1px solid var(--line) }
.hero img { display: block; width: 100%; height: 200px; object-fit: cover }
.summary { display: flex; gap: 14px; align-items: center }
.summary .box { width: 132px; height: 100px; flex: none; background: var(--scheme); border: 1px solid var(--line); border-radius: var(--r); display: grid; place-items: center; overflow: hidden }
.summary .box img { max-width: 116px; max-height: 84px; display: block }
.summary .box img.photo { max-width: none; max-height: none; width: 100%; height: 100%; object-fit: cover }
.summary .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px }
.summary h1 { margin: 0; font-size: 20px; line-height: 26px }
.summary span { font-size: 13px; line-height: 18px; color: var(--muted) }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: 12px; line-height: 16px; padding: 4px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line) }

.rcpt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px }
.rcpt .cap { margin: 0 }
.lines { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 10px; font-size: 14px; line-height: 20px }
.lines .v { white-space: nowrap; font-weight: 600; text-align: right }
.lines .m { color: var(--muted) }
.lines .on { color: var(--accent); font-weight: 700 }
.total { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap }
.total span { font-size: 14px; font-weight: 600 }
.total b { font-size: 32px; line-height: 38px; letter-spacing: -.01em; white-space: nowrap }
.src { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 16px; color: var(--ok) }
.src svg { flex: none; margin-top: 1px }

/* builder */
.mod { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px }
.mod.on { border-color: var(--accent) }
.mod img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; flex: none; display: block; background: #fff }
.mod .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px }
.mod .txt b { font-size: 14px; line-height: 18px; font-weight: 600 }
.mod .txt span { font-size: 12px; line-height: 16px; color: var(--muted) }
.step { display: flex; align-items: center; gap: 2px; flex: none }
.step button { width: 40px; height: 40px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1 }
.step b { width: 24px; text-align: center }

/* dock */
.dock { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: var(--kb); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -4px 18px rgba(0, 0, 0, .06) }
.ctl { display: flex; gap: 8px; align-items: center }
.fchip { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); font-size: 13px; font-weight: 600; text-align: left }
.fchip .sw-img { width: 24px; height: 24px; border-radius: 4px; flex: none; display: block; object-fit: cover; background: var(--field); border: 1px dashed var(--line) }
.fchip .nm { min-width: 0; display: flex; flex-direction: column; line-height: 16px }
.fchip .nm small { font-size: 11px; font-weight: 500; color: var(--muted) }
.fchip .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cats { display: flex; gap: 4px; flex: none }
.cats button { width: 38px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); font-size: 15px; font-weight: 600 }
.cats button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.srch { display: flex; gap: 12px; align-items: center }
.field { flex: 1; min-width: 0; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface) }
.field:focus-within { border-color: var(--accent) }
.field svg { flex: none; color: var(--muted) }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; height: 100% }
.field .fake { flex: 1; min-width: 0; color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left }
.clear { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--field); color: var(--muted); font-size: 16px; line-height: 1; flex: none }
.qrbig { width: 64px; height: 64px; flex: none; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 16px var(--qr-glow) }
.acts { display: flex; gap: 10px }
.btn { flex: 1; min-width: 0; height: 52px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; white-space: nowrap; padding: 0 12px }
.btn.ghost { background: var(--surface); color: var(--accent) }
.btn.flex0 { flex: 0 0 auto }
.btn:disabled { opacity: .45 }

/* sheets and overlay */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 88vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px) }
.sheet .sh { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px }
.sheet .sh h3 { margin: 0; font-size: 16px; flex: 1 }
.sheet .sb { overflow: auto; padding: 12px 16px 18px }
.sheet .field { height: 48px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px }
.fab { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px; text-align: left; font-size: 11px; line-height: 1.3; display: flex; flex-direction: column; gap: 4px }
.fab img, .fab .ph { width: 100%; aspect-ratio: 1; border-radius: 4px; display: block; object-fit: cover; background: var(--field) }
.fab.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.fab em { font-style: normal; color: var(--muted) }
.cam { position: relative; width: 100%; aspect-ratio: 1; max-height: 52vh; background: #000; border-radius: var(--r); overflow: hidden; display: grid; place-items: center }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block }
.cam .frame { position: absolute; inset: 16%; border: 3px solid #fff; border-radius: 14px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); pointer-events: none }
.cam .wait { position: absolute; color: #fff; font-size: 13px; padding: 16px; text-align: center }
.cammsg { font-size: 13px; color: var(--muted); margin: 10px 0 14px }
.cammsg.err { color: var(--warn) }

.client { position: fixed; inset: 0; z-index: 30; background: var(--surface); overflow: auto }
.client .in { max-width: 480px; margin: 0 auto; padding: 20px 20px 120px; display: flex; flex-direction: column; gap: 18px }
.client .brand img { height: 30px; width: auto; display: block }
.client .brand .dark { display: none; height: 44px }
.client .pic { background: var(--scheme); border: 1px solid var(--line); border-radius: var(--r); display: grid; place-items: center; padding: 14px; min-height: 160px }
.client .pic img { max-height: 220px; width: auto; max-width: 100%; display: block }
.client .pic.photo { padding: 0; overflow: hidden }
.client .pic.photo img { width: 100%; max-height: 300px; object-fit: cover }
.client h2 { font-size: 26px; line-height: 32px; margin: 0 }
.client .sub { font-size: 14px; color: var(--muted); margin-top: 4px }
.client .lines { font-size: 15px }
.client .lines .v { font-weight: 500 }
.client .fabric { display: flex; align-items: center; gap: 10px; font-size: 15px }
.client .fabric img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover }
.client .sum { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 6px }
.client .sum b { font-size: 42px; line-height: 48px; letter-spacing: -.01em }
.client .fine { font-size: 12px; line-height: 17px; color: var(--muted) }
.client .timer { display: flex; align-items: center; gap: 8px; background: var(--ok-soft); color: var(--ok); border-radius: var(--r); padding: 10px 12px; font-weight: 600; font-size: 14px }
.actions { position: fixed; z-index: 31; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .client .brand .light { display: none } :root:not([data-theme="light"]) .client .brand .dark { display: block } }
:root[data-theme="dark"] .client .brand .light { display: none }
:root[data-theme="dark"] .client .brand .dark { display: block }

.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(var(--dock-h) + var(--kb) + 12px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); font-size: 13px; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 6px 18px rgba(0,0,0,.18) }

/* nonstandard */
.ans { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 6px }
.ans .q { font-weight: 600; font-size: 14px }
.ans .a { font-size: 14px }
.ans .d { font-size: 12px; color: var(--muted); display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap }
.ex { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); background: var(--warn-soft); border-radius: 3px; padding: 2px 6px; font-weight: 600 }
.form { display: flex; flex-direction: column; gap: 12px }
.form label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px }
.form input[type=text], .form input[type=tel], .form textarea { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 11px 12px; font-size: 16px; width: 100% }
.form textarea { min-height: 76px; resize: vertical }
.form input:focus, .form textarea:focus { outline: 0; border-color: var(--accent) }
.form label.toggle { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border-radius: var(--r); padding: 12px; color: var(--ink); font-size: 14px; font-weight: 600 }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent) }
.base { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px }
.base b { white-space: nowrap }
.req { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px }
.steps { display: grid; gap: 8px; font-size: 13px }
.steps div { display: flex; gap: 8px; align-items: center; color: var(--muted) }
.steps div i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex: none }
.steps div.done { color: var(--ink) }
.steps div.done i { background: var(--ok); border-color: var(--ok) }
.steps div.now { color: var(--ink); font-weight: 600 }
.steps div.now i { border-color: var(--accent); background: var(--accent-soft) }
.upl { display: flex; gap: 10px; align-items: center }
.upl img { width: 54px; height: 54px; object-fit: cover; border-radius: 4px }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out }
  .client { animation: fade .18s ease-out }
  .sw.run { animation: pulse 1.6s ease-in-out infinite }
}
@keyframes up { from { transform: translateY(24px); opacity: .6 } }
@keyframes fade { from { opacity: 0 } }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft) } }
</style>

<div id="app"></div>
<div id="dock"></div>
<div id="layer"></div>

<script src="data.js"></script>
<script>
(() => {
const D = window.PRICE_DATA;
const $app = document.getElementById('app');
const $dock = document.getElementById('dock');
const $layer = document.getElementById('layer');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub = n => n.toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₽';
const lowerFirst = s => s ? s[0].toLowerCase() + s.slice(1) : s;
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const store = { get(k, d) { try { const v = localStorage.getItem('pl_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('pl_' + k, JSON.stringify(v)); } catch (e) {} } };
const TODAY = new Date().toLocaleDateString('ru-RU');
const PRICE_LABEL = `Прайс ${D.price.factory} от ${D.price.label}`;
const LOGO_MARK = 'img/logo-mark.png', LOGO_FULL = 'img/logo-full.png';

const ICON = {

/* ---------- search ---------- */
const TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[«»"(),./+]/g, ' ');
const lat = s => norm(s).replace(/[а-я]/g, c => TR[c] ?? c).replace(/kh/g, 'h').replace(/ks/g, 'x');
const words = s => s.split(/[\s\-–×]+/).filter(Boolean);
const SYN = {
  'угол': 'угловой', 'угловой': 'угловой', 'углов': 'угловой', 'круг': 'полукруг дуга', 'круглый': 'полукруг дуга', 'полукруглый': 'полукруг',
  'шезлонг': 'шезлонгом', 'софа': 'диван', 'тахта': 'диван', 'стол': 'стол столик', 'кресла': 'кресло', 'пуфик': 'пуф', 'банкетка': 'пуф банкетка',
  'шкаф': 'шкаф витрина', 'тумбочка': 'тумба', 'комод': 'тумба шкаф', 'велюр': 'velvet велюр', 'кожа': 'кожа miura',
};
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function makeIdx(text) {
  const n = norm(text), l = lat(text);
  const ws = [...new Set([...words(n), ...words(l)])];
  return { ws, compact: l.replace(/[^a-z0-9]/g, '') };
}
const INDEX = [];
D.series.forEach(s => INDEX.push({ kind: 'series', id: s.name, ...makeIdx(`${s.name} ${s.alias} диван модульный ${s.tag}`), w: null }));
D.cfgs.forEach(c => INDEX.push({ kind: 'cfg', id: c.id, ...makeIdx(`${c.series} ${SER[c.series].alias} диван ${c.shape} ${c.dims}`), w: c.w }));
D.products.forEach(p => INDEX.push({ kind: 'prod', id: p.sku, ...makeIdx(`${p.name} ${p.series} ${p.type} ${p.group} ${p.sku}`), w: parseInt(p.dims) || null }));
FABS.forEach((f, i) => INDEX.push({ kind: 'fab', id: i, ...makeIdx(`${f.name} ${f.coll} ${f.kind} ткань`), w: null }));

function parseQuery(q) {
  let width = null;
  let rest = String(q).toLowerCase().replace(/ё/g, 'е').replace(/(\d+(?:[.,]\d+)?)\s*(м|m|метр\S*|см|cm)?(?=\s|$)/g, (m, num, unit) => {
    let v = parseFloat(num.replace(',', '.'));
    if (unit && /^(м|m|метр)/.test(unit)) v *= 100; else if (!unit && v < 10) v *= 100;
    if (v >= 60 && v <= 1200) { width = v; return ' '; }
    return m;
  });
  rest = norm(rest);
  const toks = [];
  words(rest).forEach(t => { if (t.length < 2 && !/\d/.test(t)) return; toks.push([t, ...(SYN[t] ? words(SYN[t]) : [])]); });
  return { toks, width };
}
function tokScore(alts, it) {
  let best = 0;
  for (const raw of alts) {
    const forms = [...new Set([raw, lat(raw)])];
    for (const t of forms) {
      const stem = /[а-я]/.test(t) && t.length > 5 ? t.slice(0, t.length - 2) : t;
      for (const w of it.ws) {
        if (w === t) best = Math.max(best, 3);
        else if (w.startsWith(stem)) best = Math.max(best, 2.4);
        else if (t.length >= 4 && w.includes(t)) best = Math.max(best, 1.6);
        else if (t.length >= 4 && w.length >= 4 && !/\d/.test(t)) {
          const d = lev(t, w.slice(0, t.length + 1), t.length >= 7 ? 2 : 1);
          if (d <= (t.length >= 7 ? 2 : 1)) best = Math.max(best, 1.2);
        }
      }
      const tc = t.replace(/[^a-z0-9]/g, '');
      if (best < 2 && tc.length >= 4 && it.compact.includes(tc)) best = Math.max(best, 2);
    }
  }
  return best;
}
function search(q) {
  const { toks, width } = parseQuery(q);
  const joined = lat(q).replace(/[^a-z]/g, '');
  const out = [];
  for (const it of INDEX) {
    let score = 0, ok = true;
    for (const alts of toks) { const s = tokScore(alts, it); if (!s) { ok = false; break; } score += s; }
    if (!ok && !/\d/.test(q) && joined.length >= 5 && it.compact.includes(joined)) { ok = true; score = 3; }
    if (!ok) continue;
    if (width) {
      if (it.w == null) { if (it.kind !== 'series') continue; }
      else { const diff = Math.abs(it.w - width); if (diff > 35) continue; score += 2 - diff / 35; }
    }
    if (!toks.length && !width) continue;
    out.push({ it, score });
  }
  out.sort((a, b) => b.score - a.score);
  return out.map(o => o.it);
}

/* ---------- QR scanner: camera + jsQR. Where the camera is refused, the list stays as the fallback. ---------- */
let scan = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'vendor/jsQR.min.js';
    s.onload = res; s.onerror = () => rej(new Error('jsQR')); document.head.appendChild(s); });
}
function camMsg(text, err) {
  const m = document.getElementById('cammsg'); if (m) { m.textContent = text; m.classList.toggle('err', !!err); }
  const w = document.getElementById('camwait'); if (w) w.hidden = !err; if (w && err) w.textContent = 'Камера недоступна';
}
async function startScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camMsg('Камера недоступна в этом браузере. Выберите образец из списка.', true); return; }
  try {
    const [stream] = await Promise.all([navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }), loadJsQR()]);
    const v = document.getElementById('cam');
    if (!v) { stream.getTracks().forEach(t => t.stop()); return; }
    v.srcObject = stream; await v.play().catch(() => {});
    const w = document.getElementById('camwait'); if (w) w.hidden = true;
    scan = { stream, t: 0, canvas: document.createElement('canvas') };
    const tick = () => {
      if (!scan) return;
      const vv = document.getElementById('cam'); if (!vv) { stopScan(); return; }
      if (vv.readyState >= 2 && vv.videoWidth) {
        const k = Math.min(1, 720 / Math.max(vv.videoWidth, vv.videoHeight));
        const cw = Math.round(vv.videoWidth * k), ch = Math.round(vv.videoHeight * k);
        const c = scan.canvas; c.width = cw; c.height = ch;
        const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(vv, 0, 0, cw, ch);
        const code = window.jsQR(ctx.getImageData(0, 0, cw, ch).data, cw, ch, { inversionAttempts: 'attemptBoth' });
        if (code && code.data && handleCode(code.data)) return;
      }
      scan.t = setTimeout(tick, 120);
    };
    tick();
  } catch (e) {
    camMsg('Камера не открылась. Разрешите доступ к камере для этого сайта в настройках браузера или выберите образец из списка.', true);
  }
}
function stopScan() { if (!scan) return; clearTimeout(scan.t); scan.stream.getTracks().forEach(t => t.stop()); scan = null; }
function handleCode(text) {
  const m = String(text).match(/#((?:cfg|p)-[A-Za-z0-9-]+)/);
  if (!m || !openHash(m[1], true)) { camMsg('Это не наклейка образца. Наведите на QR с образца в зале.', true); return false; }
  return true;
}
function openHash(h, fromScan) {
  let v = null;
  if (h.startsWith('cfg-') && CFG[h.slice(4)]) v = { v: 'cfg', id: h.slice(4) };
  else if (h.startsWith('p-') && PROD[h.slice(2)]) v = { v: 'prod', id: h.slice(2) };
  if (!v) return false;
  stopScan(); closeLayer(); st.stack = [{ v: 'home' }, v]; render(); window.scrollTo(0, 0);
  toast(fromScan ? 'QR считан' : 'Открыто по QR');
  return true;
}

    <div class="sb" style="font-size:14px;line-height:1.55">
      <p style="margin-top:0"><b>Задача.</b> Продавец называет цену, пока клиент в зале: стандарт — за секунды, нестандарт — с ценой основы и сроком ответа фабрики.</p>
      <p><b>Данные.</b> ${D.cfgs.length} готовых компоновок Bon Bon, Cubic и Orion со схемами из каталога, ${Object.keys(MODS).length} модулей и ${D.products.length} товаров Saloni с фото с сайта. Розница посчитана из прайса фабрики по той же формуле, что в портале закупок; исходные цифры — сайт alikahome.ru, сентябрь 2026.</p>
      <p><b>Условно.</b> Категории тканей, ответы фабрики и этапы запроса. В рабочей версии цены читаются прямо из таблицы розницы, продавец видит только розницу.</p>
      <p style="margin-bottom:0"><b>Секундомер.</b> Нажмите значок часов, найдите цену и нажмите «Показать клиенту» — экран покажет, сколько это заняло.</p></div></div></div>`;
}

/* ---------- render ---------- */
function render() {
  const v = view();
  clearInterval(reqTick);
  let html;
  if (v.v === 'home') html = vHome();
  else if (v.v === 'series') html = vSeries(v.id);
  else if (v.v === 'cfg') html = vCfg(v.id);
  else if (v.v === 'prod') html = vProd(v.id);
  else if (v.v === 'build') html = vBuild(v.id);
  else if (v.v === 'nonstd') html = vNonstd();
  else if (v.v === 'req') { html = vReq(v.id); reqTick = setInterval(() => { if (view().v === 'req') { const y = scrollY; $app.innerHTML = vReq(view().id); scrollTo(0, y); } }, 1000); }
  $app.innerHTML = html;
  $dock.innerHTML = dockHtml(v);
  measureDock();
}

/* ---------- events ---------- */
document.addEventListener('input', e => {
  if (e.target.id === 'q') { st.q = e.target.value; updateResults(); }
  else if (e.target.id === 'ns-text') { view().text = e.target.value; const box = document.getElementById('ans'); if (box) box.innerHTML = nsAnswers(view()); }
  else if (e.target.id === 'ns-phone') { view().phone = e.target.value; }
  else if (e.target.id === 'fq') { st.fq = e.target.value; fillFabrics(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ns-wait') view().wait = e.target.checked;
  if (e.target.id === 'ns-photo' && e.target.files[0]) {
    const r = new FileReader(); r.onload = () => { st.upload = r.result; render(); }; r.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('focusin', e => { if (e.target.id === 'q') window.scrollTo(0, 0); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'shade') { if (e.target === el) closeLayer(); return; }
  switch (a) {
    case 'back': back(); break;
    case 'home': home(); break;
    case 'sw': swToggle(); break;
    case 'clear': { st.q = ''; const i = document.getElementById('q'); if (i) { i.value = ''; i.focus(); } updateResults(); break; }
    case 'tosearch': { home(); const i = document.getElementById('q'); if (i) i.focus(); break; }
    case 'quick': { st.q = el.dataset.q; st.group = 'Все'; render(); break; }
    case 'group': st.group = el.dataset.g; render(); break;
    case 'series': go({ v: 'series', id }); break;
    case 'cfg': go({ v: 'cfg', id }); break;
    case 'prod': go({ v: 'prod', id }); break;
    case 'shape': view().shape = el.dataset.s; render(); break;
    case 'cat': setCat(+el.dataset.k); break;
    case 'fabrics': openFabrics(); break;
    case 'fcat': st.fcat = +el.dataset.k; fillFabrics(); break;
    case 'setfab': setFabric(+el.dataset.i); break;
    case 'nofab': setFabric(null); break;
    case 'qr': openQr(); break;
    case 'scan': closeLayer(); go({ v: el.dataset.t, id }); toast('Образец открыт'); break;
    case 'about': openAbout(); break;
    case 'close': closeLayer(); break;
    case 'build': {
      const items = {}; const from = el.dataset.from;
      if (from) CFG[from].comp.forEach(([m, n]) => items[m] = (items[m] || 0) + n);
      st.build = { series: id, items, from: from || null }; go({ v: 'build', id }); break; }
    case 'inc': st.build.items[id] = (st.build.items[id] || 0) + 1; render(); break;
    case 'dec': st.build.items[id] = Math.max(0, (st.build.items[id] || 0) - 1); render(); break;
    case 'client': openClient(el.dataset.base); break;
    case 'client-ans': openClient(view().base, +el.dataset.i); break;
    case 'kp': toast('В рабочей версии клиент получит ссылку на КП и PDF в WhatsApp'); break;
    case 'nonstd': st.upload = null; go({ v: 'nonstd', base: el.dataset.base || null, text: '', wait: true }); break;
    case 'send': {
      const v = view(); const text = (v.text || '').trim();
      if (!text) { toast('Напишите, что клиент хочет изменить'); document.getElementById('ns-text').focus(); return; }
      const no = 'Н-' + (412 + st.reqs.length);
      const b = baseInfo(v.base);
      st.reqs.unshift({ no, title: b ? b.title : text.slice(0, 40), text, phone: v.phone || '', wait: v.wait !== false, ts: Date.now(), base: b, baseKey: v.base, photo: st.upload });
      st.upload = null; st.stack.pop(); go({ v: 'req', id: no });
      toast(v.wait !== false ? 'Отправлено. Запрос первый в очереди: клиент ждёт в зале' : 'Отправлено закупщику'); break; }
    case 'req': go({ v: 'req', id }); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $layer.innerHTML) closeLayer(); });
window.addEventListener('resize', measureDock);

render();
function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); if (h) openHash(h, false); }
window.addEventListener('hashchange', fromHash);
fromHash();
})();
</script>
</body></html>
