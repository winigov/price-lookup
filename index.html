<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#B95162">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>Цена в салоне</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (the seller's phone), sticky search on top, sticky action bar at the bottom of detail screens */
:root {
  --bg: #F5F5F5; --surface: #FFFFFF; --ink: #333333; --muted: #7C7377; --line: #E7E7E7;
  --accent: #B95162; --accent-ink: #FFFFFF; --accent-soft: #F7EAED;
  --ok: #2E7D4F; --ok-soft: #E5F2EA; --warn: #93641A; --warn-soft: #F8EEDC;
  --scheme: #FFFFFF; --shade: rgba(30, 20, 24, .48);
  --font: "Montserrat", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171416; --surface: #221E20; --ink: #EEE8EA; --muted: #A99FA3; --line: #3A3336;
  --accent: #C9606F; --accent-ink: #FFFFFF; --accent-soft: #3A2328;
  --ok: #74C995; --ok-soft: #1D3226; --warn: #E2B566; --warn-soft: #3A2F1B;
  --scheme: #F3EFF0; --shade: rgba(0, 0, 0, .62); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171416; --surface: #221E20; --ink: #EEE8EA; --muted: #A99FA3; --line: #3A3336;
  --accent: #C9606F; --accent-ink: #FFFFFF; --accent-soft: #3A2328;
  --ok: #74C995; --ok-soft: #1D3226; --warn: #E2B566; --warn-soft: #3A2F1B;
  --scheme: #F3EFF0; --shade: rgba(0, 0, 0, .62); color-scheme: dark }

* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 96px }
.wrap { padding-inline: 16px }

/* top */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 16px 10px; border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 10px }
.mark { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .02em; flex: none }
.brand h1 { font-size: 17px; margin: 0; font-weight: 700; line-height: 1.15 }
.status { font-size: 12px; color: var(--ok); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none }
.brand .grow { flex: 1; min-width: 0 }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap }
.sw.run { border-color: var(--accent); color: var(--accent); background: var(--accent-soft) }

.search { margin-top: 10px; display: flex; gap: 8px }
.field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 0 10px; height: 48px }
.field:focus-within { border-color: var(--accent) }
.field input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 16px; height: 100% }
.field svg { flex: none; color: var(--muted) }
.clear { border: 0; background: none; color: var(--muted); padding: 6px; font-size: 18px; line-height: 1 }
.qr { height: 48px; width: 52px; border-radius: var(--r); border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none }

.fabbar { margin-top: 10px; display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px dashed var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 10px; font-size: 13px }
.fabbar b { font-weight: 600 }
.fabbar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sw-img { width: 26px; height: 26px; border-radius: 4px; background: var(--line) center/cover; flex: none; border: 1px solid var(--line) }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; scrollbar-width: none }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; white-space: nowrap }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600 }

/* sections and rows */
.sec { padding: 18px 16px 4px }
.sec h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px }
.list { display: grid; gap: 8px }
.row { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; text-align: left; width: 100% }
.row .pic { width: 64px; height: 64px; border-radius: 4px; flex: none; background: var(--scheme) center/contain no-repeat; border: 1px solid var(--line) }
.row .pic.photo { background-size: cover }
.row .txt { flex: 1; min-width: 0 }
.row .t { font-weight: 600; font-size: 14px; line-height: 1.25 }
.row .s { font-size: 12px; color: var(--muted); margin-top: 2px }
.row .pr { text-align: right; flex: none }
.row .pr b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap }
.row .pr small { font-size: 11px; color: var(--muted); white-space: nowrap }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px; padding: 0 1px }

.series { display: grid; gap: 10px }
.scard { position: relative; border-radius: var(--r); overflow: hidden; border: 0; padding: 0; text-align: left; background: var(--surface); width: 100% }
.scard img { display: block; width: 100%; height: 132px; object-fit: cover }
.scard .cap { position: absolute; inset: auto 0 0 0; padding: 26px 12px 10px; background: linear-gradient(transparent, rgba(20, 12, 15, .78)); color: #fff; display: flex; justify-content: space-between; align-items: end; gap: 8px }
.scard .cap b { font-size: 18px; display: block }
.scard .cap span { font-size: 12px; opacity: .9 }
.scard .cap .from { text-align: right; white-space: nowrap; font-weight: 600; font-size: 14px }

.quick { display: flex; flex-wrap: wrap; gap: 8px }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 12px; font-size: 13px }

.empty { text-align: center; padding: 28px 16px; color: var(--muted) }
.empty b { color: var(--ink); display: block; margin-bottom: 6px }

/* detail */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 10px 16px; border-bottom: 1px solid var(--line) }
.bar h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.back { border: 0; background: none; padding: 6px 8px 6px 0; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent) }
.hero { background: var(--scheme); border-bottom: 1px solid var(--line); display: grid; place-items: center; padding: 14px }
.hero img { max-height: 220px; width: auto; max-width: 100% }
.hero.photo { padding: 0 }
.hero.photo img { width: 100%; max-height: 260px; object-fit: cover }
.head { padding: 14px 16px 0 }
.head h2 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.tag { font-size: 12px; border-radius: 4px; padding: 3px 8px; background: var(--surface); border: 1px solid var(--line) }
.tag.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent }

.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.seg button { height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); font-weight: 600 }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.lbl { font-size: 12px; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; gap: 8px }
.lbl a, .lnk { color: var(--accent); font-weight: 600; background: none; border: 0; padding: 0; font-size: 12px }

.price { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px }
.price .big { font-size: 30px; font-weight: 700; letter-spacing: -.01em }
.price .cap { font-size: 12px; color: var(--muted) }
.why { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; font-size: 13px }
.why div { display: flex; justify-content: space-between; gap: 10px }
.why div span:first-child { color: var(--muted); min-width: 0 }
.why div span:last-child { text-align: right; white-space: nowrap }
.src { margin-top: 8px; font-size: 12px; color: var(--ok); display: flex; gap: 6px; align-items: center }

.actions { position: fixed; z-index: 6; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px }
.btn { flex: 1; height: 50px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; white-space: nowrap; padding: 0 12px }
.btn.ghost { background: var(--surface); color: var(--accent) }
.btn.flex0 { flex: 0 0 auto }
.btn:disabled { opacity: .45 }
.nonstd { margin: 18px 16px 0; width: calc(100% - 32px); border: 1.5px dashed var(--accent); background: transparent; color: var(--accent); border-radius: var(--r); padding: 12px; font-weight: 600; text-align: left; display: flex; gap: 10px; align-items: center }

/* builder */
.mod { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px }
.mod .pic { width: 52px; height: 52px; border-radius: 4px; background: #fff center/cover; flex: none; border: 1px solid var(--line) }
.mod .txt { flex: 1; min-width: 0; font-size: 13px }
.mod .txt b { display: block; font-weight: 600 }
.mod .txt span { color: var(--muted); font-size: 12px }
.step { display: flex; align-items: center; gap: 2px; flex: none }
.step button { width: 34px; height: 34px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1 }
.step b { width: 26px; text-align: center }
.mod.on { border-color: var(--accent) }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }

/* sheets and overlay */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--bg); width: 100%; max-width: 480px; max-height: 88vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px) }
.sheet .sh { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px }
.sheet .sh h3 { margin: 0; font-size: 16px; flex: 1 }
.sheet .sb { overflow: auto; padding: 12px 16px 18px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px }
.fab { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px; text-align: left; font-size: 11px; line-height: 1.25 }
.fab .sw-img { width: 100%; height: auto; aspect-ratio: 1; border-radius: 4px; display: block; margin-bottom: 5px }
.fab.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
.fab em { font-style: normal; color: var(--muted); display: block }

.client { position: fixed; inset: 0; z-index: 30; background: var(--surface); overflow: auto }
.client .in { max-width: 480px; margin: 0 auto; padding: 18px 16px 110px }
.client .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .14em; font-size: 13px }
.client .pic { margin-top: 16px; background: var(--scheme); border-radius: var(--r); display: grid; place-items: center; padding: 14px; border: 1px solid var(--line) }
.client .pic img { max-height: 240px; width: auto; max-width: 100% }
.client .pic.photo { padding: 0; overflow: hidden }
.client .pic.photo img { width: 100%; max-height: 300px; object-fit: cover }
.client h2 { font-size: 22px; margin: 18px 0 4px; text-wrap: balance }
.client .lines { margin-top: 12px; display: grid; gap: 6px; font-size: 14px }
.client .lines div { display: flex; justify-content: space-between; gap: 10px }
.client .lines div span:last-child { white-space: nowrap }
.client .sum { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px }
.client .sum .big { font-size: 38px; font-weight: 700; letter-spacing: -.01em }
.client .fine { font-size: 12px; color: var(--muted); margin-top: 8px }
.client .timer { margin-top: 14px; background: var(--ok-soft); color: var(--ok); border-radius: var(--r); padding: 10px 12px; font-weight: 600; font-size: 14px }

.toast { position: fixed; z-index: 40; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); font-size: 13px; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 6px 18px rgba(0,0,0,.18) }

/* nonstandard */
.ans { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px }
.ans .q { font-weight: 600 }
.ans .a { font-size: 14px }
.ans .d { font-size: 12px; color: var(--muted); display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap }
.ex { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); background: var(--warn-soft); border-radius: 3px; padding: 2px 6px; font-weight: 600 }
.form { display: grid; gap: 12px }
.form label { font-size: 12px; color: var(--muted); display: grid; gap: 6px }
.form input[type=text], .form input[type=tel], .form textarea { border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 11px 12px; font-size: 15px; width: 100% }
.form textarea { min-height: 76px; resize: vertical }
.form input:focus, .form textarea:focus { outline: 0; border-color: var(--accent) }
.toggle { display: flex !important; grid-template-columns: none; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border-radius: var(--r); padding: 12px; color: var(--ink) !important; font-size: 14px !important; font-weight: 600 }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent) }
.base { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 13px; display: flex; justify-content: space-between; gap: 10px }
.base b { white-space: nowrap }
.req { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px }
.steps { display: grid; gap: 8px; font-size: 13px }
.steps div { display: flex; gap: 8px; align-items: center; color: var(--muted) }
.steps div i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex: none }
.steps div.done { color: var(--ink) }
.steps div.done i { background: var(--ok); border-color: var(--ok) }
.steps div.now { color: var(--ink); font-weight: 600 }
.steps div.now i { border-color: var(--accent); background: var(--accent-soft) }
.note { font-size: 12px; color: var(--muted); padding: 18px 16px 0; line-height: 1.5 }
.upl { display: flex; gap: 10px; align-items: center }
.cam { position: relative; width: 100%; aspect-ratio: 1; max-height: 52vh; background: #000; border-radius: var(--r); overflow: hidden; display: grid; place-items: center }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block }
.cam .frame { position: absolute; inset: 16%; border: 3px solid #fff; border-radius: 14px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); pointer-events: none }
.cam .wait { position: absolute; color: #fff; font-size: 13px; padding: 16px; text-align: center }
.cammsg { font-size: 13px; color: var(--muted); margin: 10px 0 14px }
.cammsg.err { color: var(--warn) }
.upl img { width: 54px; height: 54px; object-fit: cover; border-radius: 4px }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out }
  .client { animation: fade .18s ease-out }
  .sw.run { animation: pulse 1.6s ease-in-out infinite }
}
@keyframes up { from { transform: translateY(24px); opacity: .6 } }
@keyframes fade { from { opacity: 0 } }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft) } }
</style>

<div id="app"></div>
<div id="layer"></div>

<script src="data.js"></script>
<script>
(() => {
const D = window.PRICE_DATA;
const $app = document.getElementById('app');
const $layer = document.getElementById('layer');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub = n => n.toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₽';
const lowerFirst = s => s ? s[0].toLowerCase() + s.slice(1) : s;
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const store = { get(k, d) { try { const v = localStorage.getItem('pl_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('pl_' + k, JSON.stringify(v)); } catch (e) {} } };
const TODAY = new Date().toLocaleDateString('ru-RU');
const PRICE_LABEL = `Прайс ${D.price.factory} от ${D.price.label}`;

const ICON = {
  search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  qr: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>',
  timer: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>',
};

/* ---------- data ---------- */
const MODS = D.mods;
const CFG = Object.fromEntries(D.cfgs.map(c => [c.id, c]));
const PROD = Object.fromEntries(D.products.map(p => [p.sku, p]));
const SER = Object.fromEntries(D.series.map(s => [s.name, s]));
const FABS = D.fabrics;

const priceAt = (p, cat) => p.length > 1 ? p[cat - 1] : p[0];
const cfgTitle = c => `${c.series}, ${lowerFirst(c.shape)}`;
const cfgDims = c => c.dims.replace(/×/g, ' × ') + ' см';

/* Factory answers on nonstandard requests. Examples for the demo, not real factory answers. */
const ANSWERS = [
  { series: 'Bon Bon', q: 'Металлические ножки вместо деревянных', kind: 'fix', v: 18000, lead: '+2 недели к сроку', date: '14.08.2026', words: 'ножки опоры металл металлические хром' },
  { series: 'Bon Bon', q: 'Пуф Ø90 вместо Ø108', kind: 'fix', v: 9000, lead: 'срок тот же', date: '03.07.2026', words: 'пуф меньше диаметр размер' },
  { series: 'Cubic', q: 'Глубина сиденья 110 см вместо 99 см', kind: 'pct', v: 12, lead: '14–16 недель', date: '02.09.2026', words: 'глубина глубже сиденье размер' },

/* ---------- search ---------- */
const TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[«»"(),./+]/g, ' ');
const lat = s => norm(s).replace(/[а-я]/g, c => TR[c] ?? c).replace(/kh/g, 'h').replace(/ks/g, 'x');
const words = s => s.split(/[\s\-–×]+/).filter(Boolean);
const SYN = {
  'угол': 'угловой', 'угловой': 'угловой', 'углов': 'угловой', 'круг': 'полукруг дуга', 'круглый': 'полукруг дуга', 'полукруглый': 'полукруг',
  'шезлонг': 'шезлонгом', 'софа': 'диван', 'тахта': 'диван', 'стол': 'стол столик', 'кресла': 'кресло', 'пуфик': 'пуф', 'банкетка': 'пуф банкетка',
  'шкаф': 'шкаф витрина', 'тумбочка': 'тумба', 'комод': 'тумба шкаф', 'велюр': 'velvet велюр', 'кожа': 'кожа miura',
};
function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function makeIdx(text) {
  const n = norm(text), l = lat(text);
  const ws = [...new Set([...words(n), ...words(l)])];
  return { ws, compact: l.replace(/[^a-z0-9]/g, '') };
}
const INDEX = [];
D.series.forEach(s => INDEX.push({ kind: 'series', id: s.name, ...makeIdx(`${s.name} ${s.alias} диван модульный ${s.tag}`), w: null }));
D.cfgs.forEach(c => INDEX.push({ kind: 'cfg', id: c.id, ...makeIdx(`${c.series} ${SER[c.series].alias} диван ${c.shape} ${c.dims}`), w: c.w }));
D.products.forEach(p => INDEX.push({ kind: 'prod', id: p.sku, ...makeIdx(`${p.name} ${p.series} ${p.type} ${p.group} ${p.sku}`), w: parseInt(p.dims) || null }));
FABS.forEach((f, i) => INDEX.push({ kind: 'fab', id: i, ...makeIdx(`${f.name} ${f.coll} ${f.kind} ткань`), w: null }));

function parseQuery(q) {
  let width = null;
  let rest = String(q).toLowerCase().replace(/ё/g, 'е').replace(/(\d+(?:[.,]\d+)?)\s*(м|m|метр\S*|см|cm)?(?=\s|$)/g, (m, num, unit) => {
    let v = parseFloat(num.replace(',', '.'));
    if (unit && /^(м|m|метр)/.test(unit)) v *= 100; else if (!unit && v < 10) v *= 100;
    if (v >= 60 && v <= 1200) { width = v; return ' '; }
    return m;
  });
  rest = norm(rest);
  const toks = [];
  words(rest).forEach(t => { if (t.length < 2 && !/\d/.test(t)) return; toks.push([t, ...(SYN[t] ? words(SYN[t]) : [])]); });
  return { toks, width };
}
function tokScore(alts, it) {
  let best = 0;
  for (const raw of alts) {
    const forms = [...new Set([raw, lat(raw)])];
    for (const t of forms) {
      const stem = /[а-я]/.test(t) && t.length > 5 ? t.slice(0, t.length - 2) : t;
      for (const w of it.ws) {
        if (w === t) best = Math.max(best, 3);
        else if (w.startsWith(stem)) best = Math.max(best, 2.4);
        else if (t.length >= 4 && w.includes(t)) best = Math.max(best, 1.6);
        else if (t.length >= 4 && w.length >= 4 && !/\d/.test(t)) {
          const d = lev(t, w.slice(0, t.length + 1), t.length >= 7 ? 2 : 1);
          if (d <= (t.length >= 7 ? 2 : 1)) best = Math.max(best, 1.2);
        }
      }
      const tc = t.replace(/[^a-z0-9]/g, '');
      if (best < 2 && tc.length >= 4 && it.compact.includes(tc)) best = Math.max(best, 2);
    }
  }
  return best;
}
function search(q) {
  const { toks, width } = parseQuery(q);
  // "bon bon" typed as one word or with a space should both hit Bon Bon
  const joined = lat(q).replace(/[^a-z]/g, '');
  const out = [];
  for (const it of INDEX) {
    let score = 0, ok = true;
    for (const alts of toks) { const s = tokScore(alts, it); if (!s) { ok = false; break; } score += s; }
    if (!ok && !/\d/.test(q) && joined.length >= 5 && it.compact.includes(joined)) { ok = true; score = 3; }
    if (!ok) continue;
    if (width) {
      if (it.w == null) { if (it.kind !== 'series') continue; }
      else { const diff = Math.abs(it.w - width); if (diff > 35) continue; score += 2 - diff / 35; }
    }
    if (!toks.length && !width) continue;
    out.push({ it, score });
  }
  out.sort((a, b) => b.score - a.score);
  return out.map(o => o.it);
}

/* ---------- QR scanner: camera + jsQR. Where the camera is refused, the list above stays as the fallback. ---------- */
let scan = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'vendor/jsQR.min.js';
    s.onload = res; s.onerror = () => rej(new Error('jsQR')); document.head.appendChild(s); });
}
function camMsg(text, err) {
  const m = document.getElementById('cammsg'); if (m) { m.textContent = text; m.classList.toggle('err', !!err); }
  const w = document.getElementById('camwait'); if (w) w.hidden = !err; if (w && err) w.textContent = 'Камера недоступна';
}
async function startScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camMsg('Камера недоступна в этом браузере. Выберите образец из списка.', true); return; }
  try {
    const [stream] = await Promise.all([navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }), loadJsQR()]);
    const v = document.getElementById('cam');
    if (!v) { stream.getTracks().forEach(t => t.stop()); return; }
    v.srcObject = stream; await v.play().catch(() => {});
    const w = document.getElementById('camwait'); if (w) w.hidden = true;
    scan = { stream, t: 0, canvas: document.createElement('canvas') };
    const tick = () => {
      if (!scan) return;
      const vv = document.getElementById('cam'); if (!vv) { stopScan(); return; }
      if (vv.readyState >= 2 && vv.videoWidth) {
        const k = Math.min(1, 720 / Math.max(vv.videoWidth, vv.videoHeight));
        const cw = Math.round(vv.videoWidth * k), ch = Math.round(vv.videoHeight * k);
        const c = scan.canvas; c.width = cw; c.height = ch;
        const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(vv, 0, 0, cw, ch);
        const code = window.jsQR(ctx.getImageData(0, 0, cw, ch).data, cw, ch, { inversionAttempts: 'attemptBoth' });
        if (code && code.data && handleCode(code.data)) return;
      }
      scan.t = setTimeout(tick, 120);
    };
    tick();
  } catch (e) {
    camMsg('Камера не открылась. Разрешите доступ к камере для этого сайта в настройках браузера или выберите образец из списка.', true);
  }
}
function stopScan() { if (!scan) return; clearTimeout(scan.t); scan.stream.getTracks().forEach(t => t.stop()); scan = null; }
function handleCode(text) {
  const m = String(text).match(/#((?:cfg|p)-[A-Za-z0-9-]+)/);
  if (!m || !openHash(m[1], true)) { camMsg('Это не наклейка образца. Наведите на QR с образца в зале.', true); return false; }
  return true;
}
function openHash(h, fromScan) {
  let v = null;
  if (h.startsWith('cfg-') && CFG[h.slice(4)]) v = { v: 'cfg', id: h.slice(4) };
  else if (h.startsWith('p-') && PROD[h.slice(2)]) v = { v: 'prod', id: h.slice(2) };
  if (!v) return false;
  stopScan(); closeLayer(); st.stack = [{ v: 'home' }, v]; render(); window.scrollTo(0, 0);
  toast(fromScan ? 'QR считан' : 'Открыто по QR');
  return true;
}

/* ---------- render ---------- */
function render() {
  const v = view();

  let html;
  if (v.v === 'home') html = vHome();

  else if (v.v === 'cfg') html = vCfg(v.id);

  else if (v.v === 'req') { html = vReq(v.id); reqTick = setInterval(() => { if (view().v === 'req') { const y = scrollY; $app.innerHTML = vReq(view().id); scrollTo(0, y); } }, 1000); }
  $app.innerHTML = html;
}

    case 'home': home(); break;
    case 'sw': swToggle(); break;
    case 'clear': { st.q = ''; const i = document.getElementById('q'); if (i) { i.value = ''; i.focus(); } updateResults(); break; }
    case 'quick': st.q = el.dataset.q; st.group = 'Все'; render(); break;
    case 'group': st.group = el.dataset.g; render(); break;
    case 'series': go({ v: 'series', id }); break;
    case 'cfg': go({ v: 'cfg', id }); break;
    case 'prod': go({ v: 'prod', id }); break;
    case 'shape': view().shape = el.dataset.s; render(); break;
    case 'cat': setCat(+el.dataset.k); break;
    case 'fabrics': openFabrics(); break;
    case 'fcat': st.fcat = +el.dataset.k; fillFabrics(); break;
    case 'setfab': setFabric(+el.dataset.i); break;
    case 'nofab': setFabric(null); break;
    case 'qr': openQr(); break;
    case 'scan': closeLayer(); go({ v: el.dataset.t, id }); toast('QR считан'); break;
    case 'about': openAbout(); break;
    case 'close': closeLayer(); break;
    case 'build': {
      const items = {}; const from = el.dataset.from;
      if (from) CFG[from].comp.forEach(([m, n]) => items[m] = (items[m] || 0) + n);
      st.build = { series: id, items, from: from || null }; go({ v: 'build', id }); break; }
    case 'inc': st.build.items[id] = (st.build.items[id] || 0) + 1; render(); break;
    case 'dec': st.build.items[id] = Math.max(0, (st.build.items[id] || 0) - 1); render(); break;
    case 'client': openClient(el.dataset.base); break;
    case 'client-ans': openClient(view().base, +el.dataset.i); break;
    case 'kp': toast('В рабочей версии клиент получит ссылку на КП и PDF в WhatsApp'); break;
    case 'nonstd': st.upload = null; go({ v: 'nonstd', base: el.dataset.base || null, text: '', wait: true }); break;
    case 'send': {
      const v = view(); const text = (v.text || '').trim();
      if (!text) { toast('Напишите, что клиент хочет изменить'); document.getElementById('ns-text').focus(); return; }
      const no = 'Н-' + (412 + st.reqs.length);
      const b = baseInfo(v.base);
      st.reqs.unshift({ no, title: b ? b.title : text.slice(0, 40), text, phone: v.phone || '', wait: v.wait !== false, ts: Date.now(), base: b, baseKey: v.base, photo: st.upload });
      st.upload = null; st.stack.pop(); go({ v: 'req', id: no });
      toast(v.wait !== false ? 'Отправлено. Запрос первый в очереди: клиент ждёт в зале' : 'Отправлено закупщику'); break; }
    case 'req': go({ v: 'req', id }); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $layer.innerHTML) closeLayer(); });

render();
function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); if (h) openHash(h, false); }
window.addEventListener('hashchange', fromHash);
fromHash();
})();
</script>
</body></html>
